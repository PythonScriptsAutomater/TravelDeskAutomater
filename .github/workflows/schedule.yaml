name: JotForm → Google Sheets Sync

on:
  # Run on a schedule (every day at 2 AM UTC — adjust as needed)
  schedule:
    - cron: '0 2 * * *'

  # Allow manual triggering from the GitHub UI
  workflow_dispatch:
    inputs:
      total_limit:
        description: 'Max submissions to pull (script 1)'
        required: false
        default: '8000'
      start_date:
        description: 'Filter start date for approval sync (script 2, format: YYYY-MM-DD HH:MM:SS)'
        required: false
        default: '2023-08-01 00:00:00'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Full TDR submission sync
  # ─────────────────────────────────────────────
  sync-tdr:
    name: 'Step 1 · Sync TDR Updated sheet'
    runs-on: ubuntu-latest

    env:
      JOTFORM_API_KEY:      ${{ secrets.JOTFORM_API_KEY }}
      JOTFORM_FORM_ID:      ${{ secrets.JOTFORM_FORM_ID }}
      SPREADSHEET_NAME:     ${{ vars.SPREADSHEET_NAME }}
      WORKSHEET_NAME_TDR:   ${{ vars.WORKSHEET_NAME_TDR }}
      TOTAL_LIMIT:          ${{ github.event.inputs.total_limit || '8000' }}
      PAGE_SIZE:            '200'
      SLEEP_BETWEEN_CALLS:  '2'
      WRITE_BATCH_SIZE:     '500'
      GOOGLE_CREDENTIALS_FILE: credentials.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google credentials from secret
        # The secret GOOGLE_CREDENTIALS_JSON holds the full service-account JSON
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run TDR sync script
        run: python jotform_to_sheets.py

  # ─────────────────────────────────────────────
  # JOB 2 — Approval status sync (runs AFTER job 1)
  # ─────────────────────────────────────────────
  sync-approval:
    name: 'Step 2 · Sync Approval Status sheet'
    runs-on: ubuntu-latest
    needs: sync-tdr          # ← waits for job 1 to succeed

    env:
      JOTFORM_API_KEY:          ${{ secrets.JOTFORM_API_KEY }}
      JOTFORM_FORM_ID:          ${{ secrets.JOTFORM_FORM_ID }}
      SPREADSHEET_NAME:         ${{ vars.SPREADSHEET_NAME }}
      WORKSHEET_NAME_APPROVAL:  ${{ vars.WORKSHEET_NAME_APPROVAL }}
      START_DATE:               ${{ github.event.inputs.start_date || '2023-08-01 00:00:00' }}
      PAGE_SIZE:                '300'
      SLEEP_BETWEEN_CALLS:      '1'
      MAX_PAGES:                '500'
      WRITE_BATCH_SIZE:         '500'
      GOOGLE_CREDENTIALS_FILE:  credentials.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google credentials from secret
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run Approval Status sync script
        run: python approval_status_sync.py